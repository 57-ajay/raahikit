services:
  cab-agent:
    build: .
    command: uv run main.py start
    restart: always
    network_mode: "host"
    env_file: .env.local

  token-server:
    build: .
    command: uv run uvicorn server:app --host 0.0.0.0 --port 3000
    restart: always
    ports:
      - "3000:3000"
    env_file: .env.local
