services:
  # --- LiveKit Server ---
  livekit:
    image: livekit/livekit-server:v1.13.3
    restart: unless-stopped
    command: --config /livekit.yaml
    volumes:
      - ./livekit-config/livekit.yaml:/livekit.yaml
    ports:
      - "7883:7883"
      - "7884:7884/udp"
    environment:
      - LIVEKIT_IP=${PUBLIC_IP}
    networks:
      raahi-net:
        aliases:
          - raahikit-livekit
    depends_on:
      - redis

  # --- Redis ---
  redis:
    image: redis/redis-stack:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8001:8001"
    networks:
      raahi-net:
        aliases:
          - raahikit-redis

  # --- AI Agent ---
  agent:
    build: .
    restart: always
    environment:
      - LIVEKIT_URL=ws://raahikit-livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
    networks:
      raahi-net:
        aliases:
          - raahikit-agent
    depends_on:
      - livekit

  # --- Token Server ---
  token-server:
    build: .
    restart: always
    command: uv run uvicorn server:app --host 0.0.0.0 --port 3000
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - REDIS_URL=redis://raahikit-redis:6379
    networks:
      raahi-net:
        aliases:
          - raahikit-token-server
    depends_on:
      - redis

networks:
  raahi-net:
    external: true
